# GitHub Pages caches assets for ten minutes and their filenames never change,
# so a returning visitor keeps the old CSS and JavaScript after a deploy. This
# gives every version its own URL.
name: Stamp assets

on:
  push:
    branches: [main]
    paths:
      - "docs/style.css"
      - "docs/app.js"
      - "docs/index.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stamp-assets
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    # Without this the commit below would retrigger this workflow forever.
    if: "!contains(github.event.head_commit.message, 'chore: stamp assets')"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Stamp the stylesheet and script with a content hash
        run: node .github/scripts/stamp-assets.mjs

      - name: Commit, but only if something changed
        run: |
          if git diff --quiet; then
            echo "Already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "chore: stamp assets"
          git push
